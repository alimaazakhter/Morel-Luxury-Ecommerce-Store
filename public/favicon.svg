<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E29C" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1815" />
      <stop offset="100%" stop-color="#090807" />
    </radialGradient>
  </defs>
  <!-- Background Circle with Gold Border -->
  <circle cx="256" cy="256" r="236" fill="url(#bg)" stroke="url(#gold)" stroke-width="16" />
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.35" />
  <!-- Luxury Monogram M -->
  <text
    x="256"
    y="335"
    font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
    font-size="285"
    font-weight="bold"
    fill="url(#gold)"
    text-anchor="middle"
    letter-spacing="-5"
  >M</text>
</svg>
